<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)" />

    <!-- Primary meta -->
    <title>Emmanuel Kurinaah · Software Engineer · Fullstack · Cloud · Applied AI</title>
    <meta
      name="description"
      content="Emmanuel Kurinaah is an Associate Software Engineer building fullstack platforms, cloud infrastructure, and applied-AI systems, from AWS migrations serving 34,000+ users to RAG and agentic-AI prototypes."
    />
    <meta name="author" content="Emmanuel Kurinaah" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Emmanuel Kurinaah, Software Engineer" />
    <meta
      property="og:description"
      content="Fullstack · Cloud · Applied AI. Building intelligent, well-engineered systems."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emmanuel Kurinaah, Software Engineer" />
    <meta
      name="twitter:description"
      content="Fullstack · Cloud · Applied AI. Building intelligent, well-engineered systems."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Theme: set before paint to avoid a flash. Dark-first; respects stored choice / system. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var useLight = stored ? stored === 'light' : prefersLight;
          if (useLight) document.documentElement.classList.remove('dark');
        } catch (e) {
          /* keep dark-first default */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
